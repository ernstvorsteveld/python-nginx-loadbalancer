services:
  app1:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: app1
    ports:
      - "${APP1_PORT}:8000"
    environment:
      - SERVER_NAME=${APP1_SERVER_NAME}
      - FAIL_MIN=${FAIL_MIN}
      - FAIL_MAX=${FAIL_MAX}
    restart: unless-stopped

  app2:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: app2
    ports:
      - "${APP2_PORT}:8000"
    environment:
      - SERVER_NAME=${APP2_SERVER_NAME}
      - FAIL_MIN=${FAIL_MIN}
      - FAIL_MAX=${FAIL_MAX}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-loadbalancer
    ports:
      - "${NGINX_PORT}:80"
    environment:
      - USER_TOKEN_1=${USER_TOKEN_1}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app1
      - app2
    restart: unless-stopped
